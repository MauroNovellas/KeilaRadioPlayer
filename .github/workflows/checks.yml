name: checks

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run checks
        run: |
          ./tests/run.sh
          shellcheck -x -e SC1090,SC1091,SC2030,SC2031,SC2034,SC2016 lib/ui-responsive.sh tests/ui-responsive.sh
          bash ./tests/recording-formats.sh
          bash ./tests/pre-rc.sh
          bash ./tests/ui-theme.sh
          bash ./tests/ui-responsive.sh
