name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TMPDIR: /tmp/keila-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck ffmpeg jq python3 util-linux mpv socat
      - name: Run the same checks as local development
        shell: bash
        run: |
          mkdir -p "$TMPDIR"
          bash tests/check.sh | tee "$RUNNER_TEMP/check-summary.log"
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/check-summary.log
            /tmp/keila-ci/keila-check.*/**/output.log
          if-no-files-found: warn
          retention-days: 7
