name: checks

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run checks
        run: |
          ./tests/run.sh
          shellcheck -x -e SC1090,SC1091,SC2030,SC2031,SC2034,SC2016 lib/player.sh lib/input.sh lib/ui-responsive.sh lib/ui-safe-width.sh lib/ui-desktop.sh lib/ui-desktop-primary.sh lib/ui-desktop-balance.sh lib/ui-update-status.sh lib/ui-search.sh lib/ui-desktop-search-pane.sh lib/ui-terminal-guard.sh lib/search.sh lib/app-search.sh lib/update.sh lib/update-validation.sh tests/player-ipc.sh tests/player-lifecycle.sh tests/recording-switch.sh tests/favorite-confirm.sh tests/ui-responsive.sh tests/ui-desktop.sh tests/ui-update-status.sh tests/search-integrated.sh tests/search-transition.sh tests/search-favorites.sh tests/input-repeat.sh tests/ui-desktop-search-pane.sh tests/ui-terminal-guard.sh tests/update-check.sh
          bash ./tests/player-ipc.sh
          bash ./tests/player-lifecycle.sh
          bash ./tests/recording-switch.sh
          bash ./tests/favorite-confirm.sh
          bash ./tests/recording-formats.sh
          bash ./tests/pre-rc.sh
          bash ./tests/ui-theme.sh
          bash ./tests/ui-responsive.sh
          bash ./tests/ui-desktop.sh
          bash ./tests/ui-update-status.sh
          bash ./tests/search-integrated.sh
          bash ./tests/search-transition.sh
          bash ./tests/search-favorites.sh
          bash ./tests/input-repeat.sh
          bash ./tests/ui-desktop-search-pane.sh
          bash ./tests/ui-terminal-guard.sh
          bash ./tests/update-check.sh
